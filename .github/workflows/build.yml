name: Build & Test ShanaPress

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ShanaPress.sln
            rid: win-x64
            proj: src/ShanaPress.App/ShanaPress.App.csproj
          - os: ubuntu-latest
            target: src/ShanaPress.Desktop/ShanaPress.Desktop.csproj
            rid: linux-x64
            proj: src/ShanaPress.Desktop/ShanaPress.Desktop.csproj
          - os: macos-latest
            target: src/ShanaPress.Desktop/ShanaPress.Desktop.csproj
            rid: osx-arm64
            proj: src/ShanaPress.Desktop/ShanaPress.Desktop.csproj

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build (Release)
        run: |
          dotnet build "${{ matrix.target }}" -c Release
          dotnet build tests/ShanaPress.Tests/ShanaPress.Tests.csproj -c Release

      - name: Run Core Unit Tests
        run: dotnet run --project tests/ShanaPress.Tests/ShanaPress.Tests.csproj -c Release --no-build -- --unit-only
