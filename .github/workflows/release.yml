name: Release ShanaPress

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version & tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = "1.1.0" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build & Run Unit Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build ShanaPress.sln -c Release -p:Version=$env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/ShanaPress.Tests/ShanaPress.Tests.csproj -c Release --no-build -- --unit-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Portable Single-File Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          dotnet publish src/ShanaPress.App/ShanaPress.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:APP_VERSION -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false -o "artifacts/portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "artifacts/portable/ShanaPress.exe" "artifacts/release/ShanaPress-$($env:RELEASE_TAG)-win-x64-portable.exe" -Force

      - name: Publish Self-Contained Installer Payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src/ShanaPress.App/ShanaPress.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:APP_VERSION -p:PublishSingleFile=false `
            -p:DebugType=none -p:DebugSymbols=false -o "artifacts/setup-payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download & Bundle FFmpeg Essentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "artifacts/ffmpeg.zip"
          $extractDir = "artifacts/ffmpeg-extract"
          $targetDir = "artifacts/setup-payload/ffmpeg"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $downloaded = $false
          foreach ($u in $urls) {
            curl.exe -fSL --retry 3 --retry-delay 3 -o $zipPath $u
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zipPath) -and ((Get-Item $zipPath).Length -gt 10MB)) {
              $downloaded = $true
              break
            }
          }
          if (-not $downloaded) { throw "Failed to download FFmpeg bundle." }

          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          $ffmpegLicense = Get-ChildItem -Path $extractDir -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) { throw "ffmpeg.exe or ffprobe.exe missing" }

          Copy-Item $ffmpegExe.FullName (Join-Path $targetDir "ffmpeg.exe") -Force
          Copy-Item $ffprobeExe.FullName (Join-Path $targetDir "ffprobe.exe") -Force
          if ($ffmpegLicense) { Copy-Item $ffmpegLicense.FullName (Join-Path $targetDir "FFMPEG-LICENSE.txt") -Force }

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isccCandidates = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }

          $isccDir = Split-Path -Parent $iscc
          $zhIsl = Join-Path $isccDir "Languages\ChineseSimplified.isl"
          $payloadDir = (Resolve-Path "artifacts/setup-payload").Path
          $releaseDir = (Resolve-Path "artifacts/release").Path
          $baseName = "ShanaPress-Setup-$($env:RELEASE_TAG)-win-x64"

          $isccArgs = @(
            "/DMyAppVersion=$($env:APP_VERSION)",
            "/DPayloadDir=$payloadDir",
            "/DOutputDir=$releaseDir",
            "/DOutputBaseFilename=$baseName"
          )
          if (Test-Path $zhIsl) { $isccArgs += "/DHasZhCN=1" }
          $isccArgs += "installer\ShanaPress.iss"

          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version & tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          VER="${TAG#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER="1.1.0"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: |
          dotnet build src/ShanaPress.Desktop/ShanaPress.Desktop.csproj -c Release -p:Version="$APP_VERSION"
          dotnet run --project tests/ShanaPress.Tests/ShanaPress.Tests.csproj -c Release -- --unit-only

      - name: Generate AppIcon.icns
        run: |
          mkdir -p artifacts/AppIcon.iconset
          SRC="src/ShanaPress.Desktop/Assets/logo.png"
          sips -z 16 16     "$SRC" --out artifacts/AppIcon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     "$SRC" --out artifacts/AppIcon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     "$SRC" --out artifacts/AppIcon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     "$SRC" --out artifacts/AppIcon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   "$SRC" --out artifacts/AppIcon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256   "$SRC" --out artifacts/AppIcon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   "$SRC" --out artifacts/AppIcon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512   "$SRC" --out artifacts/AppIcon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   "$SRC" --out artifacts/AppIcon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 "$SRC" --out artifacts/AppIcon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns artifacts/AppIcon.iconset -o artifacts/AppIcon.icns

      - name: Build macOS .app Bundles & .dmg (arm64 & x64)
        run: |
          mkdir -p artifacts/release
          for ARCH_PAIR in "osx-arm64 arm64" "osx-x64 x64"; do
            set -- $ARCH_PAIR
            RID="$1"
            LABEL="$2"

            PUB_DIR="artifacts/pub-$RID"
            STAGE_DIR="artifacts/dmg-stage-$RID"
            APP_DIR="$STAGE_DIR/ShanaPress.app"

            rm -rf "$PUB_DIR" "$STAGE_DIR"
            dotnet publish src/ShanaPress.Desktop/ShanaPress.Desktop.csproj \
              -c Release -r "$RID" --self-contained true \
              -p:Version="$APP_VERSION" -p:DebugType=none -p:DebugSymbols=false \
              -o "$PUB_DIR"

            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
            cp -a "$PUB_DIR/." "$APP_DIR/Contents/MacOS/"
            chmod +x "$APP_DIR/Contents/MacOS/ShanaPress"

            sed -e "s|<string>1.1.0</string>|<string>$APP_VERSION</string>|g" \
              packaging/macos/Info.plist > "$APP_DIR/Contents/Info.plist"
            cp artifacts/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"

            codesign --force --deep --sign - "$APP_DIR"
            ln -s /Applications "$STAGE_DIR/Applications"

            DMG_PATH="artifacts/release/ShanaPress-${RELEASE_TAG}-macos-${LABEL}.dmg"
            for attempt in 1 2 3; do
              hdiutil create -volname "ShanaPress" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_PATH" && break
              sleep 3
            done
            test -f "$DMG_PATH"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: artifacts/release/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version & tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          VER="${TAG#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER="1.1.0"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: |
          dotnet build src/ShanaPress.Desktop/ShanaPress.Desktop.csproj -c Release -p:Version="$APP_VERSION"
          dotnet run --project tests/ShanaPress.Tests/ShanaPress.Tests.csproj -c Release -- --unit-only

      - name: Build Linux .deb & .tar.gz Packages (x64 & arm64)
        run: |
          mkdir -p artifacts/release
          sed -i 's/\r$//' packaging/linux/build-deb.sh packaging/linux/install-desktop.sh packaging/linux/shanapress.desktop
          chmod +x packaging/linux/build-deb.sh packaging/linux/install-desktop.sh

          for ARCH_PAIR in "linux-x64 amd64 x64" "linux-arm64 arm64 arm64"; do
            set -- $ARCH_PAIR
            RID="$1"
            DEB_ARCH="$2"
            TAR_LABEL="$3"
            PUB_DIR="artifacts/pub-$RID"
            TAR_STAGE="artifacts/tar-$RID/ShanaPress"

            rm -rf "$PUB_DIR" "artifacts/tar-$RID"
            dotnet publish src/ShanaPress.Desktop/ShanaPress.Desktop.csproj \
              -c Release -r "$RID" --self-contained true \
              -p:Version="$APP_VERSION" -p:DebugType=none -p:DebugSymbols=false \
              -o "$PUB_DIR"
            chmod +x "$PUB_DIR/ShanaPress"

            if [ "$RID" = "linux-x64" ]; then
              ./packaging/linux/build-deb.sh "$PUB_DIR" "$APP_VERSION" "$DEB_ARCH" \
                "artifacts/release/ShanaPress-${RELEASE_TAG}-linux-${TAR_LABEL}.deb"
            fi

            mkdir -p "$TAR_STAGE"
            cp -a "$PUB_DIR/." "$TAR_STAGE/"
            cp docs/logo.png "$TAR_STAGE/shanapress.png"
            cp packaging/linux/shanapress.desktop "$TAR_STAGE/shanapress.desktop"
            cp packaging/linux/install-desktop.sh "$TAR_STAGE/install-desktop.sh"
            chmod +x "$TAR_STAGE/install-desktop.sh" "$TAR_STAGE/ShanaPress"

            tar -czf "artifacts/release/ShanaPress-${RELEASE_TAG}-linux-${TAR_LABEL}.tar.gz" \
              -C "artifacts/tar-$RID" "ShanaPress"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: artifacts/release/*

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/all

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Prepare Release Assets & SHA256SUMS
        run: |
          mkdir -p artifacts/final
          find artifacts/all -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' \) -exec cp {} artifacts/final/ \;
          (cd artifacts/final && sha256sum * | sort -k2 > SHA256SUMS.txt)
          ls -lh artifacts/final

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > artifacts/RELEASE_NOTES.md <<EOF
          ## ShanaPress $RELEASE_TAG — Windows · macOS · Linux

          Cross-platform GPU-accelerated batch video compressor built with .NET 8 and FFmpeg.

          ### Downloads / 下载包说明

          | Platform | File | Notes |
          | --- | --- | --- |
          | **Windows (x64)** | \`ShanaPress-Setup-$RELEASE_TAG-win-x64.exe\` | **Recommended Installer**: includes .NET 8 runtime & bundled FFmpeg |
          | **Windows (x64)** | \`ShanaPress-$RELEASE_TAG-win-x64-portable.exe\` | Single-file portable (requires FFmpeg in \`PATH\`) |
          | **macOS (Apple Silicon)** | \`ShanaPress-$RELEASE_TAG-macos-arm64.dmg\` | M1/M2/M3/M4 native \`.app\` with VideoToolbox support |
          | **macOS (Intel)** | \`ShanaPress-$RELEASE_TAG-macos-x64.dmg\` | Intel Mac \`.app\` with VideoToolbox support |
          | **Linux (x64 Debian/Ubuntu)** | \`ShanaPress-$RELEASE_TAG-linux-x64.deb\` | Native \`.deb\` package (\`sudo apt install ./ShanaPress-...\`) |
          | **Linux (x64 / arm64)** | \`ShanaPress-$RELEASE_TAG-linux-*.tar.gz\` | Portable tarball + \`install-desktop.sh\` |

          ### Platform Notes / 使用提示
          - **macOS**: Install FFmpeg via Homebrew (\`brew install ffmpeg\`). Since the \`.app\` uses ad-hoc signing, if Gatekeeper warns on first launch, run \`xattr -cr /Applications/ShanaPress.app\` (or right-click → Open).
          - **Linux**: Install FFmpeg via your package manager (e.g. \`sudo apt install ffmpeg\`). Hardware acceleration supports NVIDIA NVENC and Intel/AMD VAAPI (\`/dev/dri/renderD128\`).
          - **Windows**: The Setup \`.exe\` bundles FFmpeg GPL binaries in \`ffmpeg/\` for immediate out-of-the-box use.
          EOF
          sed -i 's/^          //' artifacts/RELEASE_NOTES.md

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "${{ github.repository }}" --yes
          fi

          gh release create "$RELEASE_TAG" \
            artifacts/final/* \
            --repo "${{ github.repository }}" \
            --title "ShanaPress $RELEASE_TAG" \
            --notes-file artifacts/RELEASE_NOTES.md
