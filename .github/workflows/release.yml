name: Release ShanaPress

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version & tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          $ver = $tag.TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = "1.0.0" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved TAG=$tag VERSION=$ver"

      - name: Restore, Build & Run Unit Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build ShanaPress.sln -c Release -p:Version=$env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/ShanaPress.Tests/ShanaPress.Tests.csproj -c Release --no-build -- --unit-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Portable Single-File Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          dotnet publish src/ShanaPress.App/ShanaPress.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:APP_VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o "artifacts/portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "artifacts/portable/ShanaPress.exe" "artifacts/release/ShanaPress-$($env:RELEASE_TAG)-win-x64-portable.exe" -Force

      - name: Publish Self-Contained Installer Payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src/ShanaPress.App/ShanaPress.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:APP_VERSION `
            -p:PublishSingleFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o "artifacts/setup-payload"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download & Bundle FFmpeg Essentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "artifacts/ffmpeg.zip"
          $extractDir = "artifacts/ffmpeg-extract"
          $targetDir = "artifacts/setup-payload/ffmpeg"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )

          $downloaded = $false
          foreach ($u in $urls) {
            Write-Host "Downloading FFmpeg from $u ..."
            curl.exe -fSL --retry 3 --retry-delay 3 -o $zipPath $u
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zipPath) -and ((Get-Item $zipPath).Length -gt 10MB)) {
              $downloaded = $true
              break
            }
          }
          if (-not $downloaded) { throw "Failed to download FFmpeg bundle from all mirrors." }

          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          $ffmpegLicense = Get-ChildItem -Path $extractDir -Recurse -Filter "LICENSE*" | Select-Object -First 1

          if (-not $ffmpegExe -or -not $ffprobeExe) {
            throw "ffmpeg.exe or ffprobe.exe missing inside downloaded archive."
          }

          Copy-Item $ffmpegExe.FullName (Join-Path $targetDir "ffmpeg.exe") -Force
          Copy-Item $ffprobeExe.FullName (Join-Path $targetDir "ffprobe.exe") -Force
          if ($ffmpegLicense) {
            Copy-Item $ffmpegLicense.FullName (Join-Path $targetDir "FFMPEG-LICENSE.txt") -Force
          }

          Get-ChildItem $targetDir | Select-Object Name, Length | Format-Table -AutoSize

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after installation." }

          $isccDir = Split-Path -Parent $iscc
          $zhIsl = Join-Path $isccDir "Languages\ChineseSimplified.isl"
          $payloadDir = (Resolve-Path "artifacts/setup-payload").Path
          $releaseDir = (Resolve-Path "artifacts/release").Path
          $baseName = "ShanaPress-Setup-$($env:RELEASE_TAG)-win-x64"

          $isccArgs = @(
            "/DMyAppVersion=$($env:APP_VERSION)",
            "/DPayloadDir=$payloadDir",
            "/DOutputDir=$releaseDir",
            "/DOutputBaseFilename=$baseName"
          )
          if (Test-Path $zhIsl) {
            $isccArgs += "/DHasZhCN=1"
          }
          $isccArgs += "installer\ShanaPress.iss"

          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = (Resolve-Path "artifacts/release").Path
          $lines = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $releaseDir "SHA256SUMS.txt"), $lines)
          Get-ChildItem $releaseDir | Select-Object Name, @{N='MB';E={[Math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $setupExe = "artifacts/release/ShanaPress-Setup-$($env:RELEASE_TAG)-win-x64.exe"
          $portableExe = "artifacts/release/ShanaPress-$($env:RELEASE_TAG)-win-x64-portable.exe"
          $sums = "artifacts/release/SHA256SUMS.txt"

          $noteLines = @(
            "## ShanaPress $($env:RELEASE_TAG) 正式发布"
            ""
            "现代化的 Windows GPU 批量视频压缩工具，原生支持 NVIDIA NVENC（H.264 / HEVC / AV1）、AMD AMF、Intel QSV 及 x264 / x265，内置深浅双主题界面与完整可视化裁剪功能。"
            ""
            "### 安装包说明"
            ""
            "| 文件 | 说明 | 运行前提 |"
            "| --- | --- | --- |"
            "| ``ShanaPress-Setup-$($env:RELEASE_TAG)-win-x64.exe`` | **标准安装版（推荐）**：一键向导安装，支持桌面快捷方式与控制面板卸载 | **无需额外安装 .NET 或 FFmpeg**，开箱即用 |"
            "| ``ShanaPress-$($env:RELEASE_TAG)-win-x64-portable.exe`` | **免安装单文件绿色版**：内置 .NET 8 运行时，双击即用 | 需系统 ``PATH`` 或同级目录已有 ``ffmpeg.exe`` / ``ffprobe.exe`` |"
            ""
            "### 主要特性"
            "- 拖拽批量入队与递归扫描，并发 ``ffprobe`` 解析 HDR / 音轨 / 字幕信息"
            "- **快速设置 (``F6``)**：支持 CRF/CQ、ABR、2-Pass 二压与按目标体积 (MB) 自动算码率"
            "- **可视化裁剪预览**：时间轴抽帧、``cropdetect`` 一键自动去黑边、单文件独立字幕覆盖"
            "- **10 秒快速试压**：提前预估完整压缩后体积并支持直接试看画质"
            "- **高级滤镜**：BWDIF/YADIF 去隔行、HDR→SDR 色调映射（Hable/Mobius/Reinhard）、降噪锐化、SRT/ASS 硬字幕烧录、PNG 图片水印与中文文字水印"
            ""
            "> 提示：标准安装版在 ``ffmpeg/`` 子目录随附 [FFmpeg](https://ffmpeg.org/) GPL 构建二进制文件（对应开源许可详见随附 ``FFMPEG-LICENSE.txt``）。"
          )
          $notesFile = "artifacts/release/RELEASE_NOTES.md"
          [System.IO.File]::WriteAllText($notesFile, ($noteLines -join "`n"), [System.Text.UTF8Encoding]::new($false))

          gh release view "$($env:RELEASE_TAG)" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete "$($env:RELEASE_TAG)" --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release create "$($env:RELEASE_TAG)" `
            "$setupExe" `
            "$portableExe" `
            "$sums" `
            --title "ShanaPress $($env:RELEASE_TAG)" `
            --notes-file "$notesFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
